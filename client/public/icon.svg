<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.4"/>
  
  <!-- Outer Shield Crest -->
  <path d="M256 64 C350 64, 416 110, 416 230 C416 350, 256 448, 256 448 C256 448, 96 350, 96 230 C96 110, 162 64, 256 64 Z" 
        fill="#1e293b" stroke="url(#gold)" stroke-width="6" opacity="0.8" filter="url(#glow)"/>
        
  <!-- Castle / Fortress -->
  <path d="M160 360 V240 L188 240 V200 H216 V240 H244 V200 H268 V200 H296 V240 H324 V200 H352 V240 L352 360 Z" 
        fill="url(#red)" stroke="#fca5a5" stroke-width="5"/>
        
  <!-- Fortress Gate -->
  <path d="M226 360 V290 A30 30 0 0 1 286 290 V360 Z" fill="#0f172a"/>
  
  <!-- Crown on Top -->
  <polygon points="256,120 274,152 310,152 282,176 292,210 256,190 220,210 230,176 202,152 238,152" 
           fill="url(#gold)" stroke="#fef08a" stroke-width="3" filter="url(#glow)"/>
</svg>
